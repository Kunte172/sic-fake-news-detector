<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="FNL / Fake News Lens hỗ trợ sàng lọc dấu hiệu đáng ngờ trong bài báo tiếng Anh." />
    <meta name="color-scheme" content="light dark" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="icon" href="/lens.svg" type="image/svg+xml" />
    <title>FNL / Fake News Lens</title>
    <script>
      try {
        const saved = localStorage.getItem('sic_theme');
        document.documentElement.dataset.theme = saved === 'dark' || saved === 'light'
          ? saved : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      } catch {}
    </script>
  </head>
  <body><div id="root"></div><script type="module" src="/src/main.jsx"></script></body>
</html>
